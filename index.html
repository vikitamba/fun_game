<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Zombie Squad 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #1a1a2e;
    font-family: -apple-system, Arial, sans-serif;
    user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 16px; color: #fff;
  }
  .topbar {
    display: flex; justify-content: space-between;
    font-weight: 700; font-size: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .badge {
    background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;
    backdrop-filter: blur(8px);
  }
  .squad-count { color: #6ee7ff; }
  .level-info { color: #ffd166; }
  #loading {
    position: fixed; inset: 0; background: #1a1a2e; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; gap: 20px;
  }
  #loading .bar {
    width: 300px; max-width: 80vw; height: 6px; background: #222; border-radius: 3px;
    overflow: hidden;
  }
  #loading .fill {
    height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e);
    width: 0%; transition: width 0.2s;
  }
  #loading .status { font-size: 14px; opacity: 0.6; }
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    z-index: 200; color: #fff; text-align: center; padding: 24px; gap: 20px;
  }
  #overlay h1 { font-size: 42px; margin-bottom: 8px; }
  #overlay p { font-size: 18px; opacity: 0.8; }
  #overlay button {
    pointer-events: auto; cursor: pointer;
    padding: 16px 48px; font-size: 20px; font-weight: 700;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff; box-shadow: 0 8px 24px rgba(59,130,246,0.5);
  }
  #overlay button:active { transform: scale(0.96); }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.7); font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div class="topbar">
    <div class="badge">Отряд: <span class="squad-count" id="squad">1</span></div>
    <div class="badge">Уровень <span class="level-info" id="levelNum">1</span></div>
  </div>
</div>

<div id="hint">← Води мышью / пальцем →</div>

<div id="loading">
  <div>Загрузка моделей...</div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
  <div class="status" id="loadStatus">0 / 0</div>
</div>

<div id="overlay">
  <h1 id="ovTitle">Zombie Squad 3D</h1>
  <p id="ovMsg">Собирай солдат. Уничтожай зомби.</p>
  <button id="ovBtn">Играть</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ============ КОНСТАНТЫ ============
const REPO = 'https://raw.githubusercontent.com/vikitamba/fun_game/main/';

const MODELS = {
  soldier: 'Characters_Sam_SingleWeapon.gltf',
  zombie: 'Zombie_Basic.gltf',
  zombieChubby: 'Zombie_Chubby.gltf',
  zombieRibcage: 'Zombie_Ribcage.gltf',
  streetLights: 'StreetLights.gltf',
  containerRed: 'Container_Red.gltf',
  containerGreen: 'Container_Green.gltf',
  barrel: 'Barrel.gltf'
};

const CFG = {
  roadWidth: 14,
  playerSmooth: 0.18,
  spawnInterval: 1.5,
  zombiesPerSpawn: 3,
  zombieSpeed: 3.5,       // юнитов в секунду
  bulletSpeed: 30,
  fireRate: 220,          // мс
  bulletDamage: 1,
  maxSquad: 50,
  gateInterval: 8,        // сек между воротами
};

// ============ СЦЕНА ============
const canvas = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 30, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 4.5, 8);
camera.lookAt(0, 1.5, -10);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ============ СВЕТ ============
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const sun = new THREE.DirectionalLight(0xfff4d6, 1.1);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 80;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x6688ff, 0.35);
fill.position.set(-15, 10, -10);
scene.add(fill);

// ============ МИР ============
const world = new THREE.Group();
scene.add(world);

// земля
const groundGeo = new THREE.PlaneGeometry(500, 500);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a2f28, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
world.add(ground);

// дорога
const roadGeo = new THREE.PlaneGeometry(CFG.roadWidth, 500);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.9 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;
road.receiveShadow = true;
world.add(road);

// бордюры
function makeEdge(side) {
  const edge = new THREE.Group();
  const baseX = side * (CFG.roadWidth / 2 + 0.15);
  for (let i = -25; i < 25; i++) {
    const seg = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.35, 5),
      new THREE.MeshStandardMaterial({
        color: i % 2 === 0 ? 0xffcc00 : 0x1a1a1a,
        roughness: 0.7
      })
    );
    seg.position.set(baseX, 0.15, i * 5);
    seg.castShadow = true;
    edge.add(seg);
  }
  return edge;
}
world.add(makeEdge(-1));
world.add(makeEdge(1));

// разметка (пунктиры по центру) — как ты просил оставить
const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
for (let i = -25; i < 25; i++) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), dashMat);
  dash.rotation.x = -Math.PI / 2;
  dash.position.set(0, 0.03, i * 5);
  world.add(dash);
}

// ============ ИГРОВЫЕ ПЕРЕМЕННЫЕ ============
const models = {};
let player = null;         // { model, mixer }
let squad = [];            // [{ model, mixer, offsetX, offsetZ }]
let zombies = [];          // [{ model, mixer, hp, speed, radius }]
let bullets = [];          // [{ mesh, vx, vz }]
let gates = [];            // [{ z, passed, left:{x,w,op,val,group}, right:{...} }]

let aimX = 0;
let lastShot = 0;
let spawnTimer = 1.0;
let gateTimer = 4;
let running = false;
let level = 1;

// ============ ЗАГРУЗКА ============
const loader = new GLTFLoader();
const keys = Object.keys(MODELS);
let loaded = 0;
const fillEl = document.getElementById('loadFill');
const statusEl = document.getElementById('loadStatus');
statusEl.textContent = `0 / ${keys.length}`;

function loadOne(key) {
  return new Promise((resolve) => {
    loader.load(REPO + MODELS[key], (gltf) => {
      models[key] = gltf;
      loaded++;
      fillEl.style.width = (loaded / keys.length * 100) + '%';
      statusEl.textContent = `${loaded} / ${keys.length}`;
      resolve(gltf);
    }, undefined, (err) => {
      console.error('Ошибка:', MODELS[key], err);
      loaded++;
      fillEl.style.width = (loaded / keys.length * 100) + '%';
      statusEl.textContent = `${loaded} / ${keys.length} (нет: ${key})`;
      resolve(null);
    });
  });
}

Promise.all(keys.map(loadOne)).then(() => {
  document.getElementById('loading').style.display = 'none';
  initDecorations();
  showStartScreen();
});

// ============ ДЕКОРАЦИИ ============
function initDecorations() {
  // фонари
  for (let i = 0; i < 20; i++) {
    const z = -i * 12 - 5;
    for (const side of [-1, 1]) {
      if (models.streetLights) {
        const clone = SkeletonUtils.clone(models.streetLights.scene);
        clone.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        clone.position.set(side * (CFG.roadWidth / 2 + 1.5), 0, z);
        clone.rotation.y = side > 0 ? Math.PI : 0;
        world.add(clone);
      }
    }
  }
  // контейнеры
  for (let i = 0; i < 10; i++) {
    const key = Math.random() < 0.5 ? 'containerRed' : 'containerGreen';
    if (!models[key]) continue;
    const clone = SkeletonUtils.clone(models[key].scene);
    clone.traverse(c => { if (c.isMesh) c.castShadow = true; });
    const side = Math.random() < 0.5 ? -1 : 1;
    clone.position.set(side * (CFG.roadWidth / 2 + 3 + Math.random() * 3), 0, -i * 20 - 10);
    clone.rotation.y = side > 0 ? Math.PI : 0;
    world.add(clone);
  }
  // бочки
  for (let i = 0; i < 8; i++) {
    if (!models.barrel) continue;
    const clone = SkeletonUtils.clone(models.barrel.scene);
    clone.traverse(c => { if (c.isMesh) c.castShadow = true; });
    const side = Math.random() < 0.5 ? -1 : 1;
    clone.position.set(side * (CFG.roadWidth / 2 - 1.5), 0, -i * 25 - 15);
    world.add(clone);
  }
}

// ============ ХЕЛПЕРЫ ============
function cloneSkinned(gltf, x, z, rotY = 0, scale = 1) {
  const model = SkeletonUtils.clone(gltf.scene);
  model.scale.setScalar(scale);
  model.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  model.position.set(x, 0, z);
  model.rotation.y = rotY;
  world.add(model);
  return model;
}

function findClip(gltf, prefer = []) {
  if (!gltf.animations || !gltf.animations.length) return null;
  for (const name of prefer) {
    const found = gltf.animations.find(a => a.name.toLowerCase().includes(name.toLowerCase()));
    if (found) return found;
  }
  return gltf.animations[0];
}

function playClip(model, clip) {
  if (!clip) return null;
  const mixer = new THREE.AnimationMixer(model);
  mixer.clipAction(clip).play();
  return mixer;
}

function makeSoldier(x, z) {
  const gltf = models.soldier;
  if (!gltf) return null;
  const model = cloneSkinned(gltf, x, z, Math.PI);
  const clip = findClip(gltf, ['Run_Gun', 'Run', 'Walk']);
  const mixer = playClip(model, clip);
  return { model, mixer };
}

function makeZombie(x, z, type = 'zombie') {
  const gltf = models[type];
  if (!gltf) return null;
  const model = cloneSkinned(gltf, x, z, 0);
  const clip = findClip(gltf, ['Walk', 'Run']);
  const mixer = playClip(model, clip);
  const hp = type === 'zombieChubby' ? 6 : type === 'zombieRibcage' ? 3 : 2;
  return { model, mixer, hp, maxHp: hp, speed: CFG.zombieSpeed * (0.8 + Math.random() * 0.5), radius: 0.7 };
}

// ============ ВОРОТА С ТЕКСТОМ ============
function makeGateTexture(text, bgColor) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 12;
  ctx.strokeRect(6, 6, 500, 244);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 160px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 140);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function spawnGateRow() {
  const half = CFG.roadWidth / 2 - 0.3;
  const gap = 0.4;
  const leftW = half - gap / 2;
  const leftX = -half;
  const rightX = gap / 2;
  const rightW = half - gap / 2;

  const leftOp = Math.random() < 0.5 ? 'add' : 'mul';
  const rightOp = leftOp === 'add' ? 'mul' : 'add';
  const leftVal = leftOp === 'add' ? Math.floor(2 + Math.random() * 6) : 2;
  const rightVal = rightOp === 'add' ? Math.floor(2 + Math.random() * 6) : 2;

  const gate = { z: -60, passed: false, left: null, right: null };

  function buildGate(x, w, op, val) {
    const group = new THREE.Group();
    const bg = op === 'add' ? '#22a85a' : '#2563eb';
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(w, 3, 0.3),
      new THREE.MeshStandardMaterial({ color: op === 'add' ? 0x22c55e : 0x3b82f6 })
    );
    block.position.set(x + w / 2, 1.5, 0);
    group.add(block);

    const textMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(w - 0.3, 1.5),
      new THREE.MeshBasicMaterial({
        map: makeGateTexture(op === 'add' ? `+${val}` : `×${val}`, bg),
        transparent: true
      })
    );
    textMesh.position.set(x + w / 2, 1.6, 0.16);
    group.add(textMesh);

    group.position.z = -60;
    world.add(group);
    return { group, x, w, op, val };
  }

  gate.left = buildGate(leftX, leftW, leftOp, leftVal);
  gate.right = buildGate(rightX, rightW, rightOp, rightVal);
  gates.push(gate);
}

function applyGate(g) {
  if (g.op === 'add') {
    for (let i = 0; i < g.val; i++) {
      if (squad.length < CFG.maxSquad) {
        const s = makeSoldier(player.model.position.x, player.model.position.z + 2 + Math.random() * 2);
        if (s) squad.push(s);
      }
    }
  } else {
    const n = squad.length;
    for (let i = 0; i < n; i++) {
      if (squad.length < CFG.maxSquad) {
        const s = makeSoldier(player.model.position.x, player.model.position.z + 2 + Math.random() * 2);
        if (s) squad.push(s);
      }
    }
  }
  updateUI();
}

// ============ ПУЛИ ============
function fire() {
  if (!player) return;
  const now = performance.now();
  if (now - lastShot < CFG.fireRate) return;
  lastShot = now;

  const count = Math.min(1 + Math.floor(squad.length / 8), 6);
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.12, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffdd33 });
    const b = new THREE.Mesh(geo, mat);
    const spread = (i - (count - 1) / 2) * 0.4;
    b.position.set(player.model.position.x + spread, 1.2, player.model.position.z - 0.5);
    world.add(b);
    bullets.push({ mesh: b, vz: -CFG.bulletSpeed, damage: CFG.bulletDamage });
  }
}

// ============ UI ============
function updateUI() {
  document.getElementById('squad').textContent = squad.length + 1;
  document.getElementById('levelNum').textContent = level;
}

function showStartScreen() {
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = 'Zombie Squad 3D';
  document.getElementById('ovMsg').textContent = 'Собирай солдат. Уничтожай зомби.';
  const btn = document.getElementById('ovBtn');
  btn.textContent = 'Играть';
  btn.onclick = () => { ov.style.display = 'none'; startGame(); };
  ov.style.display = 'flex';
}

function showEndScreen() {
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = 'Отряд уничтожен';
  document.getElementById('ovMsg').textContent = `Очки: ${squad.length} · Уровень ${level}`;
  const btn = document.getElementById('ovBtn');
  btn.textContent = 'Заново';
  btn.onclick = () => { ov.style.display = 'none'; startGame(); };
  ov.style.display = 'flex';
}

// ============ СТАРТ ============
function startGame() {
  // очистка
  squad.forEach(s => world.remove(s.model));
  zombies.forEach(z => world.remove(z.model));
  bullets.forEach(b => world.remove(b.mesh));
  gates.forEach(g => { world.remove(g.left.group); world.remove(g.right.group); });
  if (player) world.remove(player.model);

  squad = []; zombies = []; bullets = []; gates = [];
  spawnTimer = 1.0;
  gateTimer = 4;
  level = 1;

  // игрок
  const gltf = models.soldier;
  if (gltf) {
    const model = cloneSkinned(gltf, 0, 0, Math.PI);
    const clip = findClip(gltf, ['Run_Gun', 'Run', 'Walk']);
    const mixer = playClip(model, clip);
    player = { model, mixer };
  }

  updateUI();
  running = true;
}

// ============ УПРАВЛЕНИЕ ============
function setTarget(clientX) {
  const nx = (clientX / window.innerWidth) * 2 - 1;
  aimX = nx * (CFG.roadWidth / 2 - 1);
}
canvas.addEventListener('mousemove', e => setTarget(e.clientX));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches[0]) setTarget(e.touches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  if (e.touches[0]) setTarget(e.touches[0].clientX);
});

// ============ ЦИКЛ ============
const clock = new THREE.Clock();
const playerZ = 0;

function update(dt) {
  if (!running || !player) return;

  // движение игрока по X
  const targetX = THREE.MathUtils.clamp(aimX, -CFG.roadWidth / 2 + 1, CFG.roadWidth / 2 - 1);
  player.model.position.x += (targetX - player.model.position.x) * CFG.playerSmooth;
  player.model.position.z = playerZ;
  player.model.rotation.y = Math.PI;

  // отряд следует за игроком
  squad.forEach((s, i) => {
    const row = Math.floor(i / 4);
    const col = i % 4;
    const ox = (col - 1.5) * 0.9;
    const oz = 1.2 + row * 1.0;
    const tx = player.model.position.x + ox;
    const tz = player.model.position.z + oz;
    s.model.position.x += (tx - s.model.position.x) * 0.12;
    s.model.position.z += (tz - s.model.position.z) * 0.12;
    s.model.rotation.y = Math.PI;
  });

  // спавн зомби
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = CFG.spawnInterval;
    const n = CFG.zombiesPerSpawn + Math.floor(level * 0.4);
    const types = ['zombie', 'zombie', 'zombieChubby', 'zombieRibcage'];
    for (let i = 0; i < n; i++) {
      const type = types[Math.floor(Math.random() * types.length)];
      const x = (Math.random() - 0.5) * (CFG.roadWidth - 3);
      const z = -60 - Math.random() * 5;
      const zom = makeZombie(x, z, type);
      if (zom) zombies.push(zom);
    }
  }

  // движение зомби — к игроку (z растёт)
  zombies.forEach(z => {
    z.model.position.z += z.speed * dt;
    // столкновение с солдатами
    for (let i = squad.length - 1; i >= 0; i--) {
      const s = squad[i];
      const dx = s.model.position.x - z.model.position.x;
      const dz = s.model.position.z - z.model.position.z;
      if (dx * dx + dz * dz < 1.2 * 1.2) {
        world.remove(s.model);
        squad.splice(i, 1);
        z.hp--;
        if (z.hp <= 0) break;
      }
    }
    // столкновение с игроком
    const dx = player.model.position.x - z.model.position.x;
    const dz = player.model.position.z - z.model.position.z;
    if (dx * dx + dz * dz < 1.0 * 1.0) {
      z.hp = -999;
    }
  });

  // удаление мёртвых / прошедших
  zombies = zombies.filter(z => {
    if (z.hp <= 0) { world.remove(z.model); return false; }
    if (z.model.position.z > 15) { world.remove(z.model); return false; }
    return true;
  });

  // стрельба если враги близко
  const enemiesAhead = zombies.some(z => z.model.position.z < 0 && z.model.position.z > -50);
  if (enemiesAhead) fire();

  // пули
  bullets.forEach(b => {
    b.mesh.position.z += b.vz * dt;
    for (const z of zombies) {
      const dx = z.model.position.x - b.mesh.position.x;
      const dz = z.model.position.z - b.mesh.position.z;
      if (dx * dx + dz * dz < z.radius * z.radius) {
        z.hp -= b.damage;
        b.mesh.position.z = 100;
        break;
      }
    }
  });
  bullets = bullets.filter(b => {
    if (b.mesh.position.z < -80 || b.mesh.position.z > 50) {
      world.remove(b.mesh); return false;
    }
    return true;
  });

  // ворота
  gateTimer -= dt;
  if (gateTimer <= 0 && gates.length === 0) {
    gateTimer = CFG.gateInterval;
    spawnGateRow();
  }
  gates.forEach(g => {
    g.z += 6 * dt; // ворота едут на игрока (быстрее зомби)
    g.left.group.position.z = g.z;
    g.right.group.position.z = g.z;

    if (!g.passed && g.z > playerZ - 0.8 && g.z < playerZ + 1.2) {
      const px = player.model.position.x;
      if (px < g.left.x + g.left.w && px >= g.left.x) {
        applyGate(g.left); g.passed = true;
      } else if (px >= g.right.x && px < g.right.x + g.right.w) {
        applyGate(g.right); g.passed = true;
      }
    }
  });
  gates = gates.filter(g => {
    if (g.z > 15) {
      world.remove(g.left.group); world.remove(g.right.group);
      return false;
    }
    return true;
  });

  // проверка смерти
  if (squad.length === 0) {
    const closeEnemy = zombies.some(z => Math.abs(z.model.position.z - playerZ) < 3);
    if (closeEnemy) {
      running = false;
      setTimeout(() => showEndScreen(), 300);
      return;
    }
  }

  // камера чуть едет за игроком по X
  camera.position.x += (player.model.position.x * 0.25 - camera.position.x) * 0.06;
  camera.lookAt(player.model.position.x * 0.15, 1.5, -10);

  // миксеры
  if (player.mixer) player.mixer.update(dt);
  squad.forEach(s => { if (s.mixer) s.mixer.update(dt); });
  zombies.forEach(z => { if (z.mixer) z.mixer.update(dt); });

  // уровень растёт
  if (Math.floor(performance.now() / 1000 / 20) + 1 > level) {
    level = Math.floor(performance.now() / 1000 / 20) + 1;
    updateUI();
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
